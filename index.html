<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои дни</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2716%27%20fill%3D%27%231b1030%27/%3E%3Crect%20x%3D%2710%27%20y%3D%2710%27%20width%3D%2720%27%20height%3D%2720%27%20rx%3D%276%27%20fill%3D%27%23ff5d73%27/%3E%3Crect%20x%3D%2734%27%20y%3D%2710%27%20width%3D%2720%27%20height%3D%2720%27%20rx%3D%276%27%20fill%3D%27%23ffd84d%27/%3E%3Crect%20x%3D%2710%27%20y%3D%2734%27%20width%3D%2720%27%20height%3D%2720%27%20rx%3D%276%27%20fill%3D%27%234dc9ff%27/%3E%3Crect%20x%3D%2734%27%20y%3D%2734%27%20width%3D%2720%27%20height%3D%2720%27%20rx%3D%276%27%20fill%3D%27%236fdc8c%27/%3E%3Cpath%20d%3D%27M39%2045l5%205%209-10%27%20fill%3D%27none%27%20stroke%3D%27%231b1030%27%20stroke-width%3D%274%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27/%3E%3C/svg%3E"><meta name="theme-color" content="#1b1030">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f0ff;--surf:#ffffff;--ink:#1b1030;--mute:#7a6c96;--line:#e0d4f5;
--m1:#ff5d73;--m2:#ff9a4d;--m3:#ffd84d;--m4:#6fdc8c;--m5:#4dc9ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150c27;--surf:#21153b;--ink:#f6f0ff;--mute:#a597c4;--line:#352656;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150c27;--surf:#21153b;--ink:#f6f0ff;--mute:#a597c4;--line:#352656;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Onest,system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--m5);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:30px 20px 80px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
h1{font:800 clamp(44px,9vw,92px)/.95 Unbounded,sans-serif;margin:0;letter-spacing:-.04em}
h1 small{display:block;font:600 16px Onest,sans-serif;letter-spacing:0;color:var(--mute);margin-bottom:10px}
.nav{display:flex;gap:8px}
.ib{width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:transparent;font-size:20px;line-height:1}
.ib:hover{background:var(--ink);color:var(--bg)}
.main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:start}
@media(max-width:860px){.main{grid-template-columns:1fr;gap:28px}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.wd{font-size:13px;color:var(--mute);text-align:center}
.d{aspect-ratio:1/1;border-radius:16px;border:0;background:var(--surf);position:relative;padding:0;min-width:0;transition:transform .12s;color:#1b1030}
.d:hover{transform:scale(1.07);z-index:2}
.d b{position:absolute;top:6px;left:8px;font-size:12px;font-weight:600;color:var(--mute)}
.d i{font-style:normal;font-size:clamp(18px,3.4vw,30px);position:absolute;inset:0;display:grid;place-items:center;padding-top:8px}
.d u{position:absolute;top:5px;right:6px;width:17px;height:17px;border-radius:50%;background:#1b1030;color:#fff;font:700 11px/17px Onest;text-align:center;text-decoration:none}
.d.e{visibility:hidden}
.d.has b{color:rgba(27,16,48,.65)}
.d.f{opacity:.45}
.d.tdy b{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.d.sel{outline:3px solid var(--ink);outline-offset:2px}
.mc1{background:var(--m1)}.mc2{background:var(--m2)}.mc3{background:var(--m3)}.mc4{background:var(--m4)}.mc5{background:var(--m5)}.mc0{background:#cbbfe6}
.note{font-size:13px;color:var(--mute);margin-top:14px}
.ed h2{font:800 28px/1.1 Unbounded,sans-serif;margin:0;letter-spacing:-.03em}
.ed .sub{color:var(--mute);margin:4px 0 20px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surf);font-weight:500;transition:all .15s}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.big{font-size:17px;padding:14px 20px}
.pill s{text-decoration:none;opacity:.5;font-size:16px;padding-left:2px}
.pill s:hover{opacity:1}
.lb{display:block;font-weight:600;margin:24px 0 8px}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.moods button{border:0;border-radius:18px;font-size:30px;padding:12px 0;opacity:.35;transition:all .15s;color:#000}
.moods button:hover{opacity:.8}
.moods button.on{opacity:1;transform:translateY(-4px);box-shadow:0 4px 0 var(--ink)}
textarea{width:100%;min-height:130px;resize:vertical;padding:14px 16px;border-radius:18px;border:2px solid var(--line);background:var(--surf);line-height:1.55}
textarea:focus{border-color:var(--ink);outline:none}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;padding:11px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surf)}
.add button{padding:11px 18px;border-radius:999px;border:2px solid var(--ink);background:transparent;font-weight:600}
.add button:hover{background:var(--ink);color:var(--bg)}
.st{font-size:13px;color:var(--mute);margin-top:12px;min-height:20px}
.stats{margin-top:56px;border-top:3px solid var(--ink);padding-top:26px}
.stats>h2{font:800 32px/1 Unbounded,sans-serif;letter-spacing:-.03em;margin:0 0 22px}
.tabs{display:flex;gap:8px;margin-bottom:26px}
.tabs button{padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:transparent;font-weight:500}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:22px 18px;margin-bottom:40px}
.kp b{display:block;font:800 clamp(34px,5vw,52px)/1 Unbounded,sans-serif;letter-spacing:-.04em}
.kp small{color:var(--mute);font-size:14px}
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:40px 36px}
.blk h3{font:600 17px/1.2 Unbounded,sans-serif;margin:0 0 4px}
.blk .s{color:var(--mute);font-size:14px;margin:0 0 14px}
.row{display:grid;grid-template-columns:34px 1fr 54px;gap:10px;align-items:center;margin-bottom:8px;font-size:14px}
.row .t{height:14px;border-radius:7px;background:var(--surf);overflow:hidden}
.row .t div{height:100%;border-radius:7px;background:var(--ink)}
.row span:last-child{text-align:right;color:var(--mute)}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px}
.bars div{flex:1;border-radius:5px 5px 2px 2px;min-height:5px}
.bars .n{background:var(--line)}
.hm{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px}
.hm div{aspect-ratio:1/1;border-radius:4px;background:var(--line);opacity:.6}
.vs{display:flex;gap:14px}
.vs div{flex:1;border-radius:18px;padding:16px;background:var(--surf);text-align:center}
.vs b{display:block;font-size:34px;line-height:1.2}
.vs small{color:var(--mute);font-size:13px}
.vd{border-radius:22px;padding:20px 24px;margin:-14px 0 40px;background:var(--surf);border-left:10px solid var(--mute)}
.vd.bad{border-left-color:var(--m1)}.vd.good{border-left-color:var(--m4)}
.vd b{display:block;font:800 clamp(22px,4vw,32px)/1.1 Unbounded,sans-serif;letter-spacing:-.03em;margin-bottom:6px}
.vd span{color:var(--mute)}
.dn{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ring{width:150px;height:150px;border-radius:50%;position:relative;flex:none;display:grid;place-items:center}
.ring::before{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--bg)}
.ring span{position:relative;font:800 24px Unbounded,sans-serif;letter-spacing:-.03em}
.dn ul{list-style:none;margin:0;padding:0;font-size:14px;flex:1;min-width:140px}
.dn li{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.dn li i{width:12px;height:12px;border-radius:50%;flex:none}
.dn li b{margin-left:auto;font-weight:600}
[hidden]{display:none!important}
.tb{display:flex;gap:8px;align-items:center;margin-bottom:28px;flex-wrap:wrap}
.tb button{padding:9px 20px;border-radius:999px;border:2px solid var(--line);background:transparent;font-weight:600}
.tb button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.av{margin-left:auto;width:44px;height:44px;border-radius:50%;background:var(--m3);color:#1b1030;display:grid;place-items:center;font:800 18px Unbounded,sans-serif;overflow:hidden;cursor:pointer;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av.big{width:96px;height:96px;font-size:36px;margin:0;cursor:default}
.sgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:40px 36px;max-width:1000px}
.sg h3{font:600 18px Unbounded,sans-serif;margin:0 0 12px}
.sg p{color:var(--mute);font-size:14px;margin:0 0 12px}
.pf{display:flex;gap:18px;align-items:center}
.pfc{flex:1;min-width:0}
.pfc input{width:100%;padding:11px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surf);margin-bottom:10px}
.bt{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:999px;border:2px solid var(--ink);background:transparent;font-weight:600}
.btn:hover,.btn.dark{background:var(--ink);color:var(--bg)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{padding:10px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surf);font-weight:500}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.aiw{max-width:760px}
.aih{color:var(--mute);margin:0 0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{padding:9px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surf);font-size:14px}
.chip:hover{border-color:var(--ink)}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.msg{max-width:88%;padding:12px 16px;border-radius:20px;line-height:1.55;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surf);border-bottom-left-radius:6px}
.send{display:flex;gap:8px;align-items:flex-end}
.send textarea{min-height:0;flex:1}
.lnk{background:none;border:0;color:var(--mute);text-decoration:underline;margin-top:8px;padding:0}
.in{padding:11px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surf);min-width:0}
.in.w{width:92px}
select.in{width:100%;margin-top:14px}
.pt{font:800 clamp(60px,14vw,100px)/1 Unbounded,sans-serif;letter-spacing:-.04em;margin:6px 0 16px}
.pm{color:var(--mute)}
.lb2{display:inline-flex;gap:8px;align-items:center;margin:14px 14px 0 0;font-size:14px}
.tk{display:flex;align-items:center;gap:10px;margin-top:10px}
.tk span{flex:1;overflow-wrap:anywhere}
.dn2{text-decoration:line-through;opacity:.5}
.ck{width:28px;height:28px;border-radius:9px;border:2px solid var(--ink);background:transparent;color:var(--bg);font-weight:700;flex:none}
.ck.on{background:var(--ink)}
.trk{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:12px;border:0;background:transparent}
.trk.on{background:var(--surf);font-weight:600}
.now{font-weight:600;margin:4px 0}
input[type=range]{width:100%;accent-color:var(--ink);margin:8px 0}
.hk{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.hk .seg button{padding:7px 12px;font-size:13px}
.pill.k-good{border-color:var(--m4)}.pill.k-bad{border-color:var(--m1)}
.pill.on.k-good{background:var(--m4);color:#1b1030}.pill.on.k-bad{background:var(--m1);color:#1b1030}
.fx{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:56px;align-items:start}
@media(max-width:860px){.fx{grid-template-columns:1fr;gap:36px}}
.fl{text-align:center}.fl .st{text-align:center}.modes{justify-content:center}
.ring2{position:relative;width:min(310px,78vw);aspect-ratio:1;margin:26px auto 18px}
.ring2 svg{width:100%;height:100%;transform:rotate(-90deg)}
.tr2{fill:none;stroke:var(--line);stroke-width:9}
.pr2{fill:none;stroke:var(--c);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .6s linear,stroke .3s}
.ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ctr .pt{font-size:clamp(46px,13vw,70px);margin:0}
.dots{display:flex;gap:10px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--c)}
.ctl{display:flex;gap:20px;justify-content:center;align-items:center;margin:26px 0}
.cb{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:var(--surf);font-size:22px;line-height:1}
.cb:hover{border-color:var(--ink)}
.cb.go{width:88px;height:88px;background:var(--ink);color:var(--bg);border-color:var(--ink);font-size:32px}
.fl select{max-width:420px}
.durs{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
#pl{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin:-8px -20px 20px;padding:8px 20px;background:var(--bg);border-bottom:2px solid var(--line)}
.pb{display:flex;align-items:center;gap:6px;position:relative}
.pn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pb button{border:0;background:transparent;font-size:18px;width:40px;height:40px;border-radius:50%}
.pb button:hover{background:var(--surf)}
.pb .pp{background:var(--ink);color:var(--bg)}
.pb .pbb{width:auto;padding:0 16px;font-size:15px;border:2px solid var(--line);border-radius:999px;font-weight:500;height:38px}
.pb input[type=range]{width:130px;margin:0}
.pls{position:absolute;top:100%;left:0;right:0;max-height:260px;overflow:auto;background:var(--surf);border:2px solid var(--line);border-radius:18px;padding:8px;margin-top:8px;z-index:40}
@media(max-width:640px){.pb input[type=range]{display:none}}
.seg button.plus.on{background:var(--m4);color:#1b1030;border-color:var(--m4)}
.seg button.minus.on{background:var(--m1);color:#1b1030;border-color:var(--m1)}
.hk .seg button{min-width:44px;font-weight:700;font-size:16px}
.logo{display:flex;margin-right:10px}.logo svg{width:42px;height:42px;border-radius:13px}
.mn{margin-top:40px;max-width:640px}.mn summary{cursor:pointer;color:var(--mute);font-weight:500}.mn p{color:var(--mute);font-size:14px}
.tk small{color:var(--mute);font-size:13px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div id='pl'></div><header>
    <h1><small id="yr"></small><span id="mt"></span></h1>
    <div class="nav">
      <button class="ib" id="prev" aria-label="Предыдущий месяц">‹</button>
      <button class="ib" id="tod" aria-label="К сегодняшнему дню" title="Сегодня">●</button>
      <button class="ib" id="next" aria-label="Следующий месяц">›</button>
    </div>
  </header>
  <nav class='tb' id='tb'><span class='logo' role='img' aria-label='Мои дни'><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='#1b1030'/><rect x='10' y='10' width='20' height='20' rx='6' fill='#ff5d73'/><rect x='34' y='10' width='20' height='20' rx='6' fill='#ffd84d'/><rect x='10' y='34' width='20' height='20' rx='6' fill='#4dc9ff'/><rect x='34' y='34' width='20' height='20' rx='6' fill='#6fdc8c'/><path d='M39 45l5 5 9-10' fill='none' stroke='#1b1030' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/></svg></span><button class='on' data-t='days'>Дни</button><button data-t='ai'>ИИ</button><button data-t='focus'>Фокус</button><button data-t='cf'>Codeforces</button><button data-t='set'>Настройки</button><span class='av' id='avs' data-t='set' role='button' aria-label='Настройки'></span></nav>
  <div id='v-days'><div class="main">
    <div><div class="cal" id="cal"></div><p class="note">Цвет клетки — настроение, кружок с галочкой — продуктивный день.</p></div>
    <div class="ed" id="ed"></div>
  </div>
  <section class="stats">
    <h2>Статистика</h2>
    <div class="tabs"><button data-r="m" class="on">Этот месяц</button><button data-r="a">Всё время</button></div>
    <div id="sx"></div>
  </section>
  </div>
  <div id='v-ai' hidden></div><div id='v-focus' hidden></div><div id='v-cf' hidden></div><div id='v-set' hidden></div>
</div>
<script>
const MOODS=['😞','😕','😐','🙂','😄'];
const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WDF=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const WDS=['пн','вт','ср','чт','пт','сб','вс'];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=new Date(),TODAY=iso(now);
let S={habits:[{id:'p',name:'Продуктивный день'}],days:{}};
let view={y:now.getFullYear(),m:now.getMonth()},sel=TODAY,store=null,timer=null,range='m';

async function load(){
  try{
    if(window.claude){
      const db=await claude.use('db'),u=await claude.use('user');
      if(db&&u){
        const id=await u.id();
        store=db.collection('data/users/'+id).doc('tracker');
        const s=await store.get();
        if(s.exists&&s.data().json){S=JSON.parse(s.data().json);return}
      }
    }
  }catch(e){store=null}
  try{const r=localStorage.getItem('moi-dni');if(r&&!store)S=JSON.parse(r)}catch(e){}
}
function save(){
  clearTimeout(timer);
  if($('st'))$('st').textContent='Сохраняю…';
  timer=setTimeout(async()=>{
    const j=JSON.stringify(S);let msg='Сохранено в этом браузере';
    try{localStorage.setItem('moi-dni',j)}catch(e){}
    try{if(store){await store.set({json:j});msg='Сохранено'}}catch(e){msg='Облако недоступно, копия лежит в браузере'}
    if($('st'))$('st').textContent=msg;
  },400);
}
const day=k=>S.days[k]||(S.days[k]={c:[],m:0,t:''});
const has=h=>S.habits.some(x=>x.id===h);
const doneH=(k,h)=>{const d=S.days[k];return !!(d&&d.c.includes(h))};
const isDone=k=>doneH(k,S.habits[0].id);
const rec=x=>x&&(x.m||x.t||x.c.length);
function streakFor(h){
  const ks=Object.keys(S.days).filter(k=>doneH(k,h)).sort();
  let best=0,run=0,prev=null;

  h.innerHTML=`<div class='pb'>${has?`<div class='pn nt'>${M.i>=0?esc(M.list[M.i].n):'—'}</div><button data-p='pv' aria-label='Назад'>⏮</button><button class='pp' data-p='pp' aria-label='Играть или пауза'>${AU.paused?'▶':'⏸'}</button><button data-p='nx' aria-label='Дальше'>⏭</button><input type='range' id='ppr' min='0' max='${AU.duration||1}' step='1' value='${AU.currentTime||0}' aria-label='Перемотка'><input type='range' id='pvv' min='0' max='1' step='.05' value='${AU.volume}' aria-label='Громкость' style='width:80px'><button data-p='ls' aria-label='Список'>☰</button><button data-p='add' aria-label='Добавить'>＋</button>`:`<button class='pbb' data-p='add'>🎵 Добавить музыку</button>`}<input type='file' id='pfi' accept='audio/*' multiple hidden>${plOpen&&has?`<div class='pls'>${M.list.map((m,i)=>`<button class='trk nt${i===M.i?' on':''}' data-p='t${i}'>${esc(m.n)}</button>`).join('')}</div>`:''}</div>`;
  i18n(h);
}
$('pl').onclick=e=>{const b=e.target.closest('button');if(!b)return;const p=b.dataset.p;
  if(p==='add')$('pfi').click();
  else if(p==='pv')mPrev();else if(p==='nx')mNext();
  else if(p==='pp'){if(M.i<0&&M.list.length)playIdx(0);else if(AU.paused)AU.play().catch(()=>{});else AU.pause()}
  else if(p==='ls'){plOpen=!plOpen;renderPlayer()}
  else if(p&&p[0]==='t'){plOpen=false;playIdx(+p.slice(1))}};
$('pl').onchange=e=>{if(e.target.id==='pfi'){addFiles(e.target.files);e.target.value=''}};
$('pl').oninput=e=>{if(e.target.id==='ppr')AU.currentTime=+e.target.value;if(e.target.id==='pvv')AU.volume=+e.target.value};
AU.onplay=AU.onpause=renderPlayer;
function renderFocus(){
  const ts=S.tasks.filter(t=>!t.done),td=S.focus.filter(f=>f.d===TODAY),mins=td.reduce((s,f)=>s+f.m,0),f=P.mode==='f',c=f?'--m1':'--m4';
  if(P.left===null)P.left=dur();
  $('v-focus').innerHTML=`<div class='fx'><div class='fl'>
<div class='seg modes'><button data-a='mdf' class='${f?'on':''}'>Фокус</button><button data-a='mdb' class='${f?'':'on'}'>Перерыв</button></div>
<div class='ring2' style='--c:var(${c})'><svg viewBox='0 0 200 200' aria-hidden='true'><circle cx='100' cy='100' r='90' class='tr2'/><circle cx='100' cy='100' r='90' class='pr2' id='prg' stroke-dasharray='565.5' style='stroke-dashoffset:${(565.5*(1-P.left/dur())).toFixed(1)}'/></svg><div class='ctr'><div class='pt' id='pt'>${fm2(P.left)}</div><div class='pm'>${f?'Фокус':'Перерыв'}</div></div></div>
<div class='dots' style='--c:var(${c})'>${[0,1,2,3].map(i=>`<i class='${i<P.cyc%4?'on':''}'></i>`).join('')}</div>
<div class='ctl'><button class='cb' data-a='rs' aria-label='Сброс'>↺</button><button class='cb go' data-a='go' aria-label='Старт или пауза'>${P.run?'⏸':'▶'}</button><button class='cb' data-a='sk' aria-label='Пропустить'>⏭</button></div>
<select class='in' id='ts'><option value=''>Без задачи</option>${ts.map(t=>`<option value='${t.id}'${t.id===P.task?' selected':''}>${esc(t.t)}</option>`).join('')}</select>
<div class='durs'><label class='lb2'>Фокус, мин <input class='in w' type='number' min='1' max='120' id='fm' value='${S.set.fm||25}'></label><label class='lb2'>Перерыв, мин <input class='in w' type='number' min='1' max='60' id='bm' value='${S.set.bm||5}'></label></div>
<div class='kp' style='margin:28px 0 18px;text-align:left'><div><b>${td.length}</b><small>Сессий сегодня</small></div><div><b>${mins}</b><small>Минут фокуса сегодня</small></div></div>
<button class='btn' data-a='ai'>Отправить итоги дня ИИ</button><div class='st' id='fs'></div></div>
<div class='sg'><h3>Задачи</h3><div class='add'><input id='tn' class='in' maxlength='80' placeholder='Новая задача'><button data-a='ta'>Добавить</button></div>${S.tasks.map(t=>`<div class='tk'><button class='ck${t.done?' on':''}' data-td='${t.id}'>${t.done?'✓':''}</button><span class='nt${t.done?' dn2':''}'>${esc(t.t)}</span><button class='lnk' data-tx='${t.id}'>×</button></div>`).join('')}</div></div>`;
  i18n($('v-focus'));
}
let tab='days',busy=false;
const TT={days:'Мои дни',ai:'ИИ',focus:'Фокус',cf:'Codeforces',set:'Настройки'};
function setTab(t){
  tab=t;
  ['days','ai','focus','cf','set'].forEach(x=>{$('v-'+x).hidden=x!==t});
  document.querySelectorAll('#tb button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelector('header .nav').hidden=t!=='days';
  if(t==='days')all();
  else{$('yr').textContent='';$('mt').textContent=TT[t];i18n($('mt'));if(t==='ai')renderAI();else if(t==='focus')renderFocus();else if(t==='cf')renderCF();else renderSet()}
}
$('tb').onclick=e=>{const b=e.target.closest('[data-t]');if(b)setTab(b.dataset.t)};
function ctx(){
  const hn={};S.habits.forEach(h=>hn[h.id]=h.name);
  const rows=Object.keys(S.days).filter(k=>rec(S.days[k])).sort().slice(-90).map(k=>{const x=S.days[k];return k+' | галочки: '+(x.c.map(c=>hn[c]).filter(Boolean).join(', ')||'нет')+' | настроение: '+(x.m?x.m+'/5':'нет')+' | '+(x.t||'').slice(0,400)});
  return 'Ты помощник в личном трекере дней. Главная галочка: «'+S.habits[0].name+'». Настроение от 1 (плохо) до 5 (отлично). Сегодня '+TODAY+', выбранный пользователем день: '+sel+'. Отвечай на '+(isEn()?'английском':'русском')+', по-дружески, коротко и по делу, опирайся только на данные ниже, ничего не выдумывай. Если данных мало, так и скажи.'+NL+'Данные (последние записи):'+NL+rows.join(NL);
}
function renderAI(){
  const qs=['Как прошёл выбранный день?','Итоги этого месяца','Что у меня получается лучше всего?','Что мне улучшить?'];
  $('v-ai').innerHTML=`<div class='aiw'><p class='aih'>Спроси про любой день, неделю или месяц. ИИ видит твои галочки, настроение и описания.</p><div class='chips'>${qs.map(q=>`<button class='chip' data-q='${q}'>${q}</button>`).join('')}</div><div class='chat' id='chat'>${S.chat.map(m=>`<div class='msg ${m.r==='user'?'me':'ai'} nt'>${br(m.c)}</div>`).join('')}</div><div class='send'><textarea id='aq' rows='2' placeholder='Напиши вопрос'></textarea><button class='btn dark' id='as'>Спросить</button></div><div class='st' id='ast'></div><button class='lnk' id='ac'>Очистить чат</button></div>`;
  i18n($('v-ai'));
}
async function ask(q){
  q=(q||'').trim();if(!q||busy)return;
  let sm=null;try{sm=await getSM()}catch(e){}
  if(!sm){$('ast').textContent=L('ИИ недоступен в этом окне. Открой страницу в своём аккаунте Claude.');return}
  busy=true;
  const hist=S.chat.slice(-10).map(m=>({role:m.r,content:m.c}));hist.push({role:'user',content:q});
  while(hist[0].role!=='user')hist.shift();
  hist[hist.length-1].content=ctx()+NL+NL+'Вопрос: '+q;
  S.chat.push({r:'user',c:q});const a={r:'assistant',c:''};S.chat.push(a);
  renderAI();const el=$('chat').lastChild;el.textContent=L('Думаю…');
  try{const r=await sm(hist,{cache:false,onText:u=>{a.c=u.text;el.innerHTML=br(u.text)}});a.c=r.text||a.c}
  catch(e){a.c=L('Не удалось получить ответ: ')+((e&&(e.message||e.code))||'')}
  busy=false;S.chat=S.chat.slice(-30);save();renderAI();
}
$('v-ai').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.q)ask(b.dataset.q);else if(b.id==='as')ask($('aq').value);else if(b.id==='ac'){S.chat=[];save();renderAI()}};
$('v-ai').onkeydown=e=>{if(e.target.id==='aq'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(e.target.value)}};
function msg(s){const e=$('ss');if(e)e.textContent=L(s)}
function renderSet(){
  const s=S.set,sg=(k,v,l)=>`<button data-${k}='${v}' class='${(k==='th'?s.theme:k==='lg'?s.lang:String(s.ws))===String(v)?'on':''}'>${l}</button>`;
  $('v-set').innerHTML=`<div class='sgs'>
<div class='sg'><h3>Профиль</h3><div class='pf'><div class='av big'>${s.photo?`<img src='${s.photo}' alt=''>`:esc(Array.from(s.name||'?')[0].toUpperCase())}</div><div class='pfc'><input id='nm' maxlength='30' placeholder='Твоё имя' value='${esc(s.name)}'><div class='bt'><button class='btn' id='phb'>Сменить фото</button>${s.photo?`<button class='btn' id='phx'>Убрать</button>`:''}<input type='file' id='phf' accept='image/*' hidden></div></div></div></div>
<div class='sg'><h3>Аккаунт</h3><p>${store?'Данные синхронизируются с твоим аккаунтом Claude.':'Облако сейчас недоступно, данные лежат только в этом браузере.'}</p><p>Вход через Google внутри самой страницы сделать нельзя. Вход идёт через твой аккаунт Claude, а в него можно заходить через Gmail.</p><p>ИИ работает через Claude прямо на странице, ключ API не нужен.</p></div>
<div class='sg'><h3>Галочки</h3><p>+ засчитывается как прокачка и продуктивность, − как деградация. Цвет рамки показывает это в дне, а в статистике есть баланс и отдельный счёт только плюсов.</p>${S.habits.map(h=>`<div class='hk'><span>${esc(h.name)}</span><span class='seg'><button data-hk='${h.id}:good' class='plus ${h.k!=='bad'?'on':''}' aria-label='Плюс'>+</button><button data-hk='${h.id}:bad' class='minus ${h.k==='bad'?'on':''}' aria-label='Минус'>−</button></span></div>`).join('')}</div>
<div class='sg'><h3>Тема</h3><div class='seg'>${sg('th','auto','Как в системе')}${sg('th','light','Светлая')}${sg('th','dark','Тёмная')}</div></div>
<div class='sg'><h3>Язык</h3><div class='seg'>${sg('lg','ru','Русский')}${sg('lg','en','English')}</div></div>
<div class='sg'><h3>Неделя</h3><div class='seg'>${sg('ws','1','С понедельника')}${sg('ws','0','С воскресенья')}</div></div>
<div class='sg'><h3>Интеграции</h3><p>Ник Codeforces для синхронизации задач.</p><input class='in' id='cfh' maxlength='40' placeholder='Ник Codeforces' value='${esc(s.cfh||'')}' style='width:100%;margin-bottom:14px'><p>Ключ для ИИ нужен, если страница размещена вне Claude. Подойдёт ключ Gemini из Google AI Studio или ключ Anthropic (sk-ant-…). Он хранится только в этом браузере и не попадает в экспорт.</p><input class='in' id='ak' type='password' autocomplete='off' placeholder='Ключ Gemini или sk-ant-…' value='${esc(keyGet())}' style='width:100%'><p style='margin-top:12px'>Spotify и Gmail пока не подключены: для них нужна регистрация приложения и отдельный сервер.</p></div>
<div class='sg'><h3>Данные</h3><p>Импорт добавляет дни из файла к текущим, одинаковые даты заменяются.</p><div class='bt'><button class='btn' id='ex'>Экспорт JSON</button><button class='btn' id='im'>Импорт JSON</button><button class='btn' id='rs'>Удалить всё</button><input type='file' id='imf' accept='.json,application/json' hidden></div><div class='st' id='ss'></div></div></div>`;
  i18n($('v-set'));
}
function readPhoto(f){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),m=Math.min(im.width,im.height);c.width=c.height=160;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);S.set.photo=c.toDataURL('image/jpeg',.82);save();renderSet();renderAv()};im.src=r.result};r.readAsDataURL(f)}
async function exportJ(){
  const j=JSON.stringify(S,null,2);
  try{const d=await claude.use('downloads');if(d){await d.save({filename:'moi-dni-'+TODAY+'.json',data:j});msg('Файл сохранён');return}}catch(e){}
  if(!window.claude){try{const u=URL.createObjectURL(new Blob([j],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='moi-dni-'+TODAY+'.json';document.body.appendChild(a);a.click();a.remove();msg('Файл сохранён');return}catch(e){}}
  try{await navigator.clipboard.writeText(j);msg('Скачивание недоступно, JSON скопирован в буфер обмена')}catch(e){msg('Скачивание недоступно')}
}
function importJ(f){const r=new FileReader();r.onload=()=>{try{
  const o=JSON.parse(r.result);if(!o||typeof o.days!=='object')throw 0;
  const ids=new Set(S.habits.map(h=>h.id));
  (o.habits||[]).forEach(h=>{if(h&&h.id&&h.name&&!ids.has(h.id))S.habits.push({id:String(h.id),name:String(h.name)})});
  let n=0;for(const k in o.days){const v=o.days[k];if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&v&&Array.isArray(v.c)){S.days[k]={c:v.c.map(String),m:+v.m||0,t:String(v.t||'')};n++}}
  save();all();msg('Импортировано дней: '+n)}catch(e){msg('Не получилось прочитать файл, нужен JSON из этого трекера')}};r.readAsText(f)}
$('v-set').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id==='phb')$('phf').click();
  else if(b.id==='phx'){S.set.photo='';save();renderSet();renderAv()}
  else if(b.dataset.th){S.set.theme=b.dataset.th;applyTheme();save();renderSet()}
  else if(b.dataset.lg){S.set.lang=b.dataset.lg;applyLang();save();all();renderSet();renderAv();i18n(document.body)}
  else if(b.dataset.ws!==undefined){S.set.ws=+b.dataset.ws;save();renderSet()}
  else if(b.dataset.hk){const [id,k]=b.dataset.hk.split(':'),h=S.habits.find(x=>x.id===id);if(h){if(k)h.k=k;else delete h.k;save();renderSet()}}
  else if(b.id==='ex')exportJ();
  else if(b.id==='im')$('imf').click();
  else if(b.id==='rs'){if(!b.dataset.s){b.dataset.s=1;b.textContent=L('Точно удалить? Нажми ещё раз')}else{S.days={};S.habits=[{id:'p',name:'Продуктивный день'}];S.chat=[];S.tasks=[];S.focus=[];S.cf=[];save();all();renderSet();msg('Все данные удалены')}}};
$('v-set').oninput=e=>{if(e.target.id==='cfh'){S.set.cfh=e.target.value.trim();save()}if(e.target.id==='ak')keySet(e.target.value.trim());if(e.target.id==='nm'){S.set.name=e.target.value;renderAv();save()}};
$('v-set').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(e.target.id==='phf')readPhoto(f);if(e.target.id==='imf')importJ(f);e.target.value=''};
$('cal').onclick=e=>{const b=e.target.closest('[data-k]');if(b){sel=b.dataset.k;renderCal();renderEd();if(innerWidth<860)$('ed').scrollIntoView({behavior:'smooth'})}};
$('ed').onclick=e=>{
  const del=e.target.closest('[data-del]');
  if(del){const id=del.dataset.del;S.habits=S.habits.filter(x=>x.id!==id);Object.values(S.days).forEach(d=>d.c=d.c.filter(c=>c!==id));all();save();return}
  const hb=e.target.closest('[data-h]');
  if(hb){const x=day(sel),id=hb.dataset.h;x.c=x.c.includes(id)?x.c.filter(c=>c!==id):[...x.c,id];all();save();return}
  const m=e.target.closest('[data-m]');
  if(m){const x=day(sel),v=+m.dataset.m;x.m=x.m===v?0:v;all();save();return}
  if(e.target.id==='ah')addHab();
};
$('ed').onkeydown=e=>{
  if(e.target.id==='nh'&&e.key==='Enter')addHab();
  if(e.target.dataset&&e.target.dataset.h&&(e.key===' '||e.key==='Enter')){e.preventDefault();e.target.click()}
};
$('ed').oninput=e=>{if(e.target.id==='tx'){day(sel).t=e.target.value;renderCal();save()}};
function addHab(){const v=$('nh').value.trim();if(!v)return;S.habits.push({id:'h'+Date.now().toString(36),name:v});all();save()}
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-r]');if(!b)return;range=b.dataset.r;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));renderStats()};
$('prev').onclick=()=>{view.m--;if(view.m<0){view.m=11;view.y--}renderCal();renderStats()};
$('next').onclick=()=>{view.m++;if(view.m>11){view.m=0;view.y++}renderCal();renderStats()};
$('tod').onclick=()=>{view={y:now.getFullYear(),m:now.getMonth()};sel=TODAY;all()};
load().then(()=>{S.set=Object.assign({name:'',photo:'',theme:'auto',lang:'ru',ws:1},S.set||{});S.chat=S.chat||[];S.tasks=S.tasks||[];S.focus=S.focus||[];S.cf=S.cf||[];applyTheme();applyLang();renderAv();renderPlayer();all();i18n(document.body)});
</script>
